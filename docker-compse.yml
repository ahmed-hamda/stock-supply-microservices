version: "3.8"

services:

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  product-db:
    image: postgres:15
    container_name: product-db
    environment:
      POSTGRES_DB: product_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5433:5432"

  supplier-db:
    image: postgres:15
    container_name: supplier-db
    environment:
      POSTGRES_DB: supplier_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"

  supply-db:
    image: postgres:15
    container_name: supply-db
    environment:
      POSTGRES_DB: supply_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5435:5432"

  config-server:
    build: ./config-server
    container_name: config-server
    ports:
      - "8888:8888"

  eureka-server:
    build: ./eureka-server
    container_name: eureka-server
    ports:
      - "8761:8761"
    depends_on:
      - config-server
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888

  product-service:
    build: ./product-service
    container_name: product-service
    depends_on:
      - product-db
      - kafka
      - config-server
      - eureka-server
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    ports:
      - "8091:8091"

  supplier-service:
    build: ./supplier-service
    container_name: supplier-service
    depends_on:
      - supplier-db
      - config-server
      - eureka-server
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    ports:
      - "8092:8092"

  supply-service:
    build: ./supply-service
    container_name: supply-service
    depends_on:
      - supply-db
      - kafka
      - config-server
      - eureka-server
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    ports:
      - "8093:8093"

  api-gateway:
    build: ./api-gateway
    container_name: api-gateway
    depends_on:
      - config-server
      - eureka-server
      - product-service
      - supplier-service
      - supply-service
    environment:
      SPRING_CONFIG_IMPORT: optional:configserver:http://config-server:8888
    ports:
      - "8080:8080"